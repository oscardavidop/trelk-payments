# docker-compose.prod.yml — Entorno de PRODUCCIÓN
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d        # Iniciar (detached)
#   docker compose -f docker-compose.prod.yml pull         # Actualizar imágenes
#   docker compose -f docker-compose.prod.yml up -d --build  # Rebuild y deploy
#   docker compose -f docker-compose.prod.yml scale worker=4  # Escalar workers
#   docker compose -f docker-compose.prod.yml down         # Parar
#
# Secrets: Usar .env.production o variables de entorno del sistema.
# NUNCA commitear el archivo .env con credenciales reales.
#
# Escalar workers horizontalmente (sin downtime):
#   docker compose -f docker-compose.prod.yml scale worker=4
#
# Zero-downtime update de la API:
#   docker compose -f docker-compose.prod.yml up -d --no-deps --build api
#   (docker compose hace rolling update en cluster mode)

name: payments-prod

services:
  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: payments-redis
    volumes:
      - redis-data:/data
    command: >
      redis-server
        --save 900 1
        --save 300 10
        --save 60 10000
        --appendonly yes
        --appendfsync everysec
        --requirepass ${REDIS_PASSWORD:-changeme_in_production}
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_in_production}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 600M
          cpus: '0.5'

  # ── API ──────────────────────────────────────────────────────────────────
  api:
    image: payments-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_URL: "redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0"
    env_file:
      - .env
    ports:
      - "${PORT:-3001}:3001"
    healthcheck:
      test: >
        node -e "require('http').get('http://localhost:3001/health',
        r => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - internal
      - external
    deploy:
      replicas: 2                 # 2 instancias por defecto
      update_config:
        parallelism: 1            # Actualizar de a uno (zero-downtime)
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 1
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── Worker ──────────────────────────────────────────────────────────────
  worker:
    image: payments-worker:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: production
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_URL: "redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0"
    env_file:
      - .env
    # Workers SIN puertos expuestos — solo consumen de Redis/BullMQ
    restart: unless-stopped
    networks:
      - internal
    deploy:
      replicas: 2                 # Escalar según throughput de webhooks
      update_config:
        parallelism: 1
        delay: 20s                # Dar tiempo al worker activo de terminar jobs
        failure_action: rollback
      resources:
        limits:
          memory: 384M
          cpus: '0.75'
        reservations:
          memory: 96M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── Nginx (reverse proxy) ─────────────────────────────────────────────────
  # Solo uncomment si no tienes nginx externo / ingress controller
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/ssl/certs:ro
  #   depends_on:
  #     - api
  #   networks:
  #     - external
  #   restart: unless-stopped

networks:
  internal:
    driver: bridge
    internal: true       # Red interna: API↔Worker↔Redis no accesibles desde fuera
  external:
    driver: bridge       # Red externa: solo API expuesta

volumes:
  redis-data:
    driver: local
